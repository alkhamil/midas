# Render Blueprint: one free web service (Docker) that serves the API and Studio.
# Database: Neon (free Postgres). Storage: Cloudflare R2 (free S3-compatible bucket). Values marked sync:false are
# asked for when the Blueprint is created.
services:
  - type: web
    name: midas
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # Neon: postgres://USER:PASS@HOST/DB?sslmode=require
        sync: false
      - key: S3_ENDPOINT         # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: midas
      - key: MIDAS_PUBLIC_URL    # https://<your-service>.onrender.com
        sync: false
      - key: ALLOW_REGISTER      # set to false after creating your account
        value: "true"
      - key: BODY_LIMIT_MB       # free instances have 512 MB of RAM
        value: "100"
      - key: REGISTRY_URL
        value: https://registry.npmjs.org/
