[package]
name = "midas-wasm"
description = "The WASM bindings of midas-core: JSON in, JSON out, for builder-core. No logic of its own."
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midas-core = { path = "../midas-core" }
serde_json = "1"
wasm-bindgen = "0.2"
