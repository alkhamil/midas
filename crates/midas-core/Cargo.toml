[package]
name = "midas-core"
description = "Midas core in Rust: the paint model and the stroke geometry. Pure Rust: no wasm-bindgen, no web-sys, so the same core links natively."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
kurbo = "0.13"
linesweeper = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
