<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab menu</title>
  <style>
    :root { color-scheme: dark; --panel: #2a2a2d; --line: #3a3a3c; --fg: #f5f5f7; --dim: #8e8e93; --accent: #0a84ff; }
    html, body { margin: 0; height: 100%; background: var(--panel); color: var(--fg); font: 12.5px/1 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
    #menu { padding: 5px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; height: 100%; }
    .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 26px; padding: 0 10px; border: 0; background: transparent; color: var(--fg); font: inherit; text-align: left; border-radius: 5px; cursor: default; }
    .mi:hover:not(:disabled) { background: var(--accent); color: #fff; }
    .mi:disabled { color: #6e6e73; }
    .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  </style>
</head>
<body>
  <div id="menu" role="menu"></div>
  <script>
    // The tab context menu: its own window at the pointer. It acts on the tab the title bar opened it for, and closes
    // when it loses focus (a click elsewhere) or after an item.
    const tauri = window.__TAURI__;
    const win = tauri.window.getCurrentWindow();
    const menu = document.getElementById('menu');
    const call = (cmd, args) => tauri.core.invoke(cmd, args);

    function item(label, { key = '', disabled = false, run } = {}) {
      const b = document.createElement('button');
      b.className = 'mi';
      b.setAttribute('role', 'menuitem');
      b.disabled = disabled;
      b.innerHTML = '<span class="l"></span><span class="k" style="margin-left:auto;color:var(--dim)"></span>';
      b.querySelector('.l').textContent = label;
      b.querySelector('.k').textContent = key;
      // The action runs while this window is open (its invoke comes from this page), then the menu closes.
      b.onclick = async () => {
        try { await run(); } finally { await win.close(); }
      };
      return b;
    }
    const divider = () => { const d = document.createElement('div'); d.className = 'sep'; return d; };

    async function build() {
      const tab = await call('tab_menu_target');
      if (!tab) { await win.close(); return; }
      const home = tab.id === 'home';
      const doc = !tab.play && tab.route.startsWith('/file/');
      menu.textContent = '';
      menu.append(
        item('Copy Link', {
          run: async () => {
            const origin = await call('get_server_url');
            await tauri.clipboardManager.writeText(origin + tab.route);
          },
        }),
        item('Rename File', { disabled: !doc, run: () => call('tab_rename', { id: tab.id }) }),
        item('Reload Tab', { run: () => call('tab_reload', { id: tab.id }) }),
        divider(),
        item(tab.pinned ? 'Unpin Tab' : 'Pin Tab', { disabled: home, run: () => call('tab_pin', { id: tab.id, pinned: !tab.pinned }) }),
        divider(),
        item('Close Tab', { disabled: home, key: 'Ctrl+W', run: () => call('tab_close', { id: tab.id }) }),
        item('Close Other Tabs', { run: () => call('tab_close_others', { id: tab.id }) }),
        item('Close All Tabs', { run: () => call('tab_close_all') }),
      );
    }

    win.onFocusChanged(({ payload }) => { if (!payload) win.close(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') win.close(); });
    build();
  </script>
</body>
</html>
