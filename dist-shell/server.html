<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midas</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #ffffff; --line: #d2d2d7; --accent: #0a84ff; --danger: #d70015; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --accent: #0a84ff; --danger: #ff453a; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; }
    main { width: min(440px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 12px; color: var(--muted); }
    code { display: block; word-break: break-all; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 0 0 16px; }
    .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    button { font: inherit; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin: 0 0 8px; }
    #error { color: var(--danger); min-height: 1.45em; margin: 12px 0 0; }
    #change { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach the Midas server</h1>
    <p>Start the server, then press Retry. Midas uses this address:</p>
    <code id="url">…</code>
    <div class="row">
      <button id="change-open">Change URL</button>
      <button id="retry" class="primary">Retry</button>
    </div>
    <div id="change" hidden>
      <p>Enter the server address (scheme, host and port). Midas restarts to use it.</p>
      <input id="new-url" type="url" spellcheck="false" aria-label="Server URL">
      <div class="row">
        <button id="change-cancel">Cancel</button>
        <button id="change-save" class="primary">Save and restart</button>
      </div>
    </div>
    <p id="error" role="alert"></p>
  </main>
  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    const $ = id => document.getElementById(id);
    const error = text => { $('error').textContent = text || ''; };
    async function load() {
      const url = await invoke('get_server_url');
      $('url').textContent = url;
      $('new-url').value = url;
    }
    $('retry').onclick = async () => {
      $('retry').disabled = true;
      error('');
      try { await invoke('connect'); }
      catch (e) { error(String(e)); }
      finally { $('retry').disabled = false; }
    };
    $('change-open').onclick = () => { $('change').hidden = false; $('new-url').focus(); };
    $('change-cancel').onclick = () => { $('change').hidden = true; error(''); };
    $('change-save').onclick = async () => {
      error('');
      try { await invoke('set_server_url', { url: $('new-url').value }); }
      catch (e) { error(String(e)); }
    };
    load().catch(e => error(String(e)));
  </script>
</body>
</html>
