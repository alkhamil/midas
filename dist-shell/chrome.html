<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midas title bar</title>
  <style>
    :root {
      color-scheme: dark;
      --bar: #161618;
      --tab: #222225;
      --tab-hover: #29292d;
      --content: #1c1c1e;
      --fg: #f5f5f7;
      --dim: #8e8e93;
      --accent: #0a84ff;
      --line: #3a3a3c;
      --danger: #ff453a;
    }
    html, body { margin: 0; height: 100%; background: var(--bar); color: var(--fg); font: 12.5px/1 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
    #bar { display: flex; align-items: stretch; height: 100%; }
    #tabs { display: flex; align-items: stretch; gap: 1px; padding: 6px 0 0 6px; min-width: 0; }
    .tab { position: relative; display: flex; align-items: center; gap: 7px; height: 30px; margin-top: 0; padding: 0 6px 0 10px; min-width: 40px; max-width: 200px; flex: 0 1 180px; background: var(--tab); border-radius: 7px 7px 0 0; color: var(--dim); cursor: default; }
    .tab:hover { background: var(--tab-hover); color: var(--fg); }
    .tab.on { background: var(--content); color: var(--fg); }
    .tab.drop { box-shadow: inset 2px 0 0 var(--accent); }
    .tab.home { flex: 0 0 36px; justify-content: center; padding: 0; }
    .tab.pinned { flex: 0 0 34px; justify-content: center; padding: 0; }
    .tab.play .icon { color: var(--accent); }
    .icon { width: 15px; height: 15px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { width: 15px; height: 15px; }
    .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    .dot.off { display: none; }
    .x { width: 18px; height: 18px; border: 0; border-radius: 4px; background: transparent; color: var(--dim); cursor: pointer; flex: none; display: none; align-items: center; justify-content: center; padding: 0; }
    .x svg { width: 10px; height: 10px; }
    .tab.on .x, .tab:hover .x { display: inline-flex; }
    .x:hover { background: var(--line); color: var(--fg); }
    #add { width: 28px; height: 26px; align-self: center; margin-left: 4px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    #add:hover { background: var(--tab); color: var(--fg); }
    #add svg { width: 14px; height: 14px; }
    /* Empty bar space is the drag region; tabs and buttons are not (only the element carrying the attribute drags). */
    #drag { flex: 1; min-width: 40px; }
    #controls { display: flex; align-items: stretch; flex: none; }
    .wc { width: 46px; border: 0; background: transparent; color: var(--fg); cursor: default; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .wc svg { width: 10px; height: 10px; }
    .wc:hover { background: var(--tab-hover); }
    .wc.close:hover { background: #c42b1c; color: #fff; }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region>
    <div id="tabs"></div>
    <button id="add" title="New tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <div id="drag" data-tauri-drag-region></div>
    <div id="controls">
      <button class="wc" id="min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="wc" id="max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button class="wc close" id="close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.1"><path d="M0 0L10 10M10 0L0 10"/></svg></button>
    </div>
  </div>
  <script>
    // The title bar and tab strip of the desktop shell (src-tauri/src/tabs.rs). A local page: it reads the tab list,
    // sends tab commands and drives the window controls. Tabs are the Home (icon), document, Play and pinned tabs.
    const tauri = window.__TAURI__;
    const win = tauri.window.getCurrentWindow();
    const tabsEl = document.getElementById('tabs');
    let state = { tabs: [], active: null };
    let dragging = null;

    const ICON = {
      home: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5z"/></svg>',
      file: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4 1.8h5.4L12.5 5v9.2H4z"/><path d="M9.2 1.8V5h3.3"/></svg>',
      play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4L13 8z"/></svg>',
      close: '<svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2"><path d="M1 1l8 8M9 1L1 9"/></svg>',
    };

    const call = (cmd, args) => tauri.core.invoke(cmd, args);
    const send = (action) => tauri.event.emit('midas:tab-command', { action });

    function tabIcon(tab) {
      if (tab.id === 'home') return ICON.home;
      if (tab.play) return ICON.play;
      if (tab.route.startsWith('/file/')) return ICON.file;
      return ICON.home;
    }

    function render() {
      tabsEl.textContent = '';
      state.tabs.forEach((tab, index) => {
        const home = tab.id === 'home';
        const el = document.createElement('div');
        el.className = ['tab', home && 'home', tab.pinned && 'pinned', tab.play && 'play', tab.id === state.active && 'on'].filter(Boolean).join(' ');
        el.setAttribute('role', 'tab');
        el.setAttribute('aria-selected', String(tab.id === state.active));
        el.draggable = !home;
        el.dataset.id = tab.id;
        el.title = tab.title;
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = tabIcon(tab);
        el.append(icon);
        if (!home && !tab.pinned) {
          const dot = document.createElement('span');
          dot.className = 'dot' + (tab.unsaved ? '' : ' off');
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = tab.title;
          el.append(title, dot);
        }
        if (!home && !tab.pinned) {
          const x = document.createElement('button');
          x.className = 'x';
          x.title = 'Close tab';
          x.innerHTML = ICON.close;
          x.onclick = (e) => { e.stopPropagation(); call('tab_close', { id: tab.id }); };
          el.append(x);
        }
        el.onmousedown = (e) => { if (e.button === 0 && !e.target.closest('.x')) call('tab_activate', { id: tab.id }); };
        el.onauxclick = (e) => { if (e.button === 1 && !home) { e.preventDefault(); call('tab_close', { id: tab.id }); } };
        el.oncontextmenu = (e) => { e.preventDefault(); call('tab_menu_open', { id: tab.id, x: e.clientX, y: e.clientY }); };
        el.ondragstart = (e) => { dragging = tab.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tab.id); };
        el.ondragover = (e) => { e.preventDefault(); el.classList.add('drop'); };
        el.ondragleave = () => el.classList.remove('drop');
        el.ondrop = (e) => { e.preventDefault(); el.classList.remove('drop'); if (dragging && dragging !== tab.id) call('tab_move', { id: dragging, index }); dragging = null; };
        el.ondragend = () => { dragging = null; };
        tabsEl.append(el);
      });
    }

    // The window controls.
    async function syncMaximize() {
      const maximized = await win.isMaximized();
      const max = document.getElementById('max');
      max.title = maximized ? 'Restore' : 'Maximize';
      max.innerHTML = maximized
        ? '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="2.5" y="0.5" width="7" height="7"/><path d="M0.5 2.5v7h7"/></svg>'
        : '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>';
    }
    document.getElementById('min').onclick = () => win.minimize();
    document.getElementById('max').onclick = async () => { await win.toggleMaximize(); setTimeout(syncMaximize, 150); };
    document.getElementById('close').onclick = () => win.close();
    document.getElementById('add').onclick = () => call('tab_new');
    syncMaximize();

    tauri.event.listen('tabs', (event) => { state = event.payload; render(); });
    call('tabs_state').then((saved) => { state = saved; render(); });

    // Keys: tab commands and Ctrl+Q (quit) are sent to the shell, the same as in the studio.
    window.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      let action = null;
      if (e.key === 'Tab') action = e.shiftKey ? 'tab-prev' : 'tab-next';
      else if (/^[1-9]$/.test(e.key)) action = 'tab-' + e.key;
      else if (e.key.toLowerCase() === 't' && !e.shiftKey) action = 'tab-new';
      else if (e.key.toLowerCase() === 'w' && !e.shiftKey) action = 'tab-close';
      else if (e.key.toLowerCase() === 'q' && !e.shiftKey) action = 'quit';
      if (action) { e.preventDefault(); send(action); }
    });

    // Drag-reorder: a tab dropped on another moves to its place (the Home tab and pinned zone are kept by the shell).
    tabsEl.addEventListener('dragover', (e) => e.preventDefault());
  </script>
</body>
</html>
