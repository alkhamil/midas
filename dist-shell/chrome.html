<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midas tabs</title>
  <style>
    :root { color-scheme: dark; --bg: #1c1c1e; --tab: #2c2c2e; --tab-on: #3a3a3c; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #0a84ff; --line: #3a3a3c; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #strip { display: flex; align-items: stretch; height: 100%; gap: 2px; padding: 4px 6px 0; box-sizing: border-box; user-select: none; }
    .tab { position: relative; display: flex; align-items: center; gap: 6px; min-width: 120px; max-width: 220px; padding: 0 6px 0 12px; background: var(--tab); border-radius: 7px 7px 0 0; cursor: default; flex: 0 1 200px; }
    .tab.on { background: var(--tab-on); }
    .tab.drop { box-shadow: inset 2px 0 0 var(--accent); }
    .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .play .title { color: var(--accent); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    .dot.off { display: none; }
    .close { width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font: inherit; font-size: 15px; line-height: 1; cursor: pointer; flex: none; }
    .close:hover { background: var(--line); color: var(--fg); }
    #add { width: 30px; align-self: center; margin-left: 4px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 18px; cursor: pointer; }
    #add:hover { background: var(--tab); color: var(--fg); }
  </style>
</head>
<body>
  <div id="strip" role="tablist" aria-label="Tabs"></div>
  <script>
    // The tab strip of the desktop shell. Local page: it asks the shell for the tab list and sends commands.
    const tauri = window.__TAURI__;
    const strip = document.getElementById('strip');
    let state = { tabs: [], active: null };
    let dragging = null;

    const send = (action) => tauri.event.emit('midas:tab-command', { action });
    const call = (cmd, args) => tauri.core.invoke(cmd, args);

    function render() {
      strip.textContent = '';
      state.tabs.forEach((tab, index) => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.play ? ' play' : '') + (tab.id === state.active ? ' on' : '');
        el.setAttribute('role', 'tab');
        el.setAttribute('aria-selected', String(tab.id === state.active));
        el.draggable = true;
        el.dataset.id = tab.id;
        el.title = tab.title;
        const dot = document.createElement('span');
        dot.className = 'dot' + (tab.unsaved ? '' : ' off');
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = tab.title;
        const close = document.createElement('button');
        close.className = 'close';
        close.textContent = '×';
        close.title = 'Close tab';
        close.onclick = (e) => { e.stopPropagation(); call('tab_close', { id: tab.id }); };
        el.append(dot, title, close);
        el.onmousedown = (e) => { if (e.button === 0 && e.target !== close) call('tab_activate', { id: tab.id }); };
        el.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); call('tab_close', { id: tab.id }); } };
        el.ondragstart = (e) => { dragging = tab.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tab.id); };
        el.ondragover = (e) => { e.preventDefault(); el.classList.add('drop'); };
        el.ondragleave = () => el.classList.remove('drop');
        el.ondrop = (e) => { e.preventDefault(); el.classList.remove('drop'); if (dragging && dragging !== tab.id) call('tab_move', { id: dragging, index }); dragging = null; };
        el.ondragend = () => { dragging = null; };
        strip.append(el);
      });
      const add = document.createElement('button');
      add.id = 'add';
      add.textContent = '+';
      add.title = 'New tab (Ctrl+T)';
      add.onclick = () => call('tab_new');
      strip.append(add);
    }

    tauri.event.listen('tabs', (event) => { state = event.payload; render(); });
    call('tabs_state').then((saved) => { state = saved; render(); });

    const keys = { t: 'tab-new', w: 'tab-close' };
    window.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      let action = null;
      if (e.key === 'Tab') action = e.shiftKey ? 'tab-prev' : 'tab-next';
      else if (/^[1-9]$/.test(e.key)) action = 'tab-' + e.key;
      else if (keys[e.key.toLowerCase()]) action = keys[e.key.toLowerCase()];
      if (action) { e.preventDefault(); send(action); }
    });
  </script>
</body>
</html>
